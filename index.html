<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat do Servidor</title>
  <style>
    body { font-family: Arial, sans-serif; max-width:900px; margin:20px auto; padding:0 16px; }
    h1 { text-align:center; }
    #chat { border:1px solid #ccc; height:400px; overflow-y:auto; padding:10px; background:#f9f9f9; }
    #status { margin-bottom:8px; color:#444; }
    #controls { display:flex; gap:8px; margin-bottom:10px; }
    #msgBox { display:flex; gap:8px; margin-top:10px; }
    #msg { flex:1; padding:10px; font-size:1rem; }
    button { padding:10px 15px; cursor:pointer; }
    .system { color:#777; font-style:italic; }
    .own { font-weight:600; }
    .msgline { margin-bottom:6px; }
  </style>
</head>

<body>
  <h1>Chat Web</h1>
  <div id="status">Desconectado</div>

  <div id="controls">
    <input id="nome" placeholder="Usuário">
    <button id="btnConnect">Entrar</button>
    <button id="btnHistorico" disabled>Histórico</button>
    <button id="btnLimpar">Limpar</button>
  </div>

  <div id="chat"></div>

  <div id="msgBox">
    <input id="msg" placeholder="Digite sua mensagem..." disabled>
    <button id="btnSend" disabled>Enviar</button>
  </div>

<script>
(function(){
  const status     = document.getElementById('status');
  const chat       = document.getElementById('chat');
  const nomeInput  = document.getElementById('nome');

  const btnConnect = document.getElementById('btnConnect');
  const btnSend    = document.getElementById('btnSend');
  const msgInput   = document.getElementById('msg');
  const btnHistorico = document.getElementById('btnHistorico');
  const btnLimpar  = document.getElementById('btnLimpar');

  let ws = null;
  let nome = "";

  function appendLine(text, cls="") {
    const div = document.createElement('div');
    div.className = "msgline " + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function setStatus(s) {
    status.textContent = s;
  }

  btnConnect.addEventListener('click', () => {
    nome = nomeInput.value.trim();
    if (!nome) {
      alert('Digite o nome de usuário.');
      return;
    }

    const loc = window.location;
    const wsUrl = (loc.protocol === 'https:' ? 'wss://' : 'ws://')
                  + loc.hostname + ':' + loc.port + '/ws';

    ws = new WebSocket(wsUrl);

    ws.addEventListener('open', () => {
      setStatus('Conectado');
      appendLine(`Conectado ao servidor como ${nome}`, 'system');
      ws.send(JSON.stringify({ type:'join', user:nome }));

      btnSend.disabled = false;
      msgInput.disabled = false;
      btnHistorico.disabled = false;
    });

    ws.addEventListener('message', (ev) => {
      const data = JSON.parse(ev.data);

      if (data.type === 'system') {
        appendLine(data.text, 'system');
        return;
      }

      if (data.type === 'message') {
        const who = data.from === nome ? "Você" : data.from;
        appendLine(`${who}: ${data.text}`, data.from === nome ? 'own' : '');
        return;
      }

      if (data.type === 'historic') {
        appendLine('--- Histórico ---', 'system');
        data.lines.forEach(l => appendLine(l));
        appendLine('--- Fim do histórico ---', 'system');
        return;
      }
    });

    ws.addEventListener('close', () => {
      setStatus('Desconectado');
      appendLine('Conexão encerrada.', 'system');
      btnSend.disabled = true;
      msgInput.disabled = true;
      btnHistorico.disabled = true;
    });
  });

  btnSend.addEventListener('click', sendMessage);

  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  function sendMessage(){
    if (!ws || ws.readyState !== WebSocket.OPEN) return;

    const txt = msgInput.value.trim();
    msgInput.value = "";

    if (txt === "/historico") {
      ws.send(JSON.stringify({type:'historic_request'}));
      return;
    }

    ws.send(JSON.stringify({
      type:'message',
      text:txt
    }));
  }

  btnHistorico.addEventListener('click', () => {
    if (!ws) return;
    ws.send(JSON.stringify({type:'historic_request'}));
  });

  btnLimpar.addEventListener('click', () => chat.innerHTML = "");
})();
</script>
</body>
</html>
